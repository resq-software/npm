name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: master
          # zizmor: ignore[artipacked] -- changesets/action needs credentials to push version bumps
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git user
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - uses: ./.github/actions/prepare

      - name: Set up npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc

      - name: Run Changesets
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          title: "[Release] Version Packages"
          commit: "chore: version packages"
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Mirror every published package to GitHub Packages. Runs only when
      # Changesets actually published (so the workspace was built by
      # `bun run release`), and discovers packages from the filesystem — no
      # hardcoded list to drift when packages are added or removed.
      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_PKG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@resq-software:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=$GH_PKG_TOKEN" >> ~/.npmrc
          bash scripts/release/publish-github-packages.sh
