name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Each job declares its own scopes, so the attest job below does not inherit
# the release job's write access to packages and pull requests.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.published.outputs.packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: master
          # zizmor: ignore[artipacked] -- changesets/action needs credentials to push version bumps
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git user
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - uses: $/.github/actions/prepare

      - name: Set up npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc

      # The set of versions each public package already has on the registry.
      # Diffed against the manifests afterwards to work out what this run actually
      # published — see the `published` step below for why the action's own output
      # cannot be used.
      #
      # The VERSION SET, not `latest`: `npm view <name> version` answers "what is
      # latest", which is a different question from "does this version exist". A
      # package whose manifest trails latest would otherwise look newly published on
      # every run.
      - name: Record pre-publish registry versions
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/pre-publish.tsv"
          for dir in packages/*/; do
            manifest="$dir/package.json"
            [ -f "$manifest" ] || continue
            name=$(node -p "require('./$manifest').name")
            private=$(node -p "require('./$manifest').private === true")
            [ "$private" = "true" ] && continue

            versions=""
            for attempt in 1 2 3; do
              if out=$(npm view "$name" versions --json 2>&1); then
                versions="$out"
                break
              fi
              # A package that has never been published is a legitimate empty set.
              # Anything else — auth, network, a registry 5xx — must NOT be silently
              # read as "unpublished", or a transient blip would mark an untouched
              # package as newly released and send a stale tarball to attestation.
              if printf '%s' "$out" | grep -q 'E404'; then
                versions="[]"
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "::error::registry lookup failed for $name after 3 attempts"
                printf '%s\n' "$out" >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done

            printf '%s\t%s\n' "$name" "$(printf '%s' "$versions" | tr -d '\n')" >> "$RUNNER_TEMP/pre-publish.tsv"
          done
          cat "$RUNNER_TEMP/pre-publish.tsv"

      - name: Run Changesets
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: "[Release] Version Packages"
          commit-message: "chore: version packages"
          publish-script: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # What actually got published, computed rather than parsed.
      #
      # `changesets/action` derives its own `publishedPackages` output by scanning
      # the publish script's stdout for `New tag:` lines. Changeset CLI v3 prints
      # `Successfully published:` in a different format, so that scan finds nothing
      # and the output comes back empty — while `published` stays `true`, because it
      # is a boolean rather than a parse result. The attest job downstream then
      # received an empty list and the release went out with no SBOM and no
      # provenance. Comparing version sets does not depend on any CLI's output.
      - name: Determine published packages
        id: published
        run: |
          set -euo pipefail
          # The `${...}` inside the single-quoted `node -e` script is JS, not shell,
          # so it is meant to stay literal — SC2016 is a false positive.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const before = new Map();
            for (const line of fs.readFileSync(process.env.RUNNER_TEMP + "/pre-publish.tsv", "utf8").split("\n")) {
              if (!line) continue;
              const tab = line.indexOf("\t");
              const name = line.slice(0, tab);
              const parsed = JSON.parse(line.slice(tab + 1));
              // `npm view … versions --json` yields a bare string when a package has
              // exactly one published version.
              before.set(name, new Set(Array.isArray(parsed) ? parsed : [parsed]));
            }
            const published = [];
            for (const dir of fs.readdirSync("packages")) {
              const manifest = `packages/${dir}/package.json`;
              if (!fs.existsSync(manifest)) continue;
              const pkg = JSON.parse(fs.readFileSync(manifest, "utf8"));
              if (pkg.private === true) continue;
              const had = before.get(pkg.name);
              if (had === undefined) continue;
              // Newly published iff this exact version was absent beforehand.
              if (!had.has(pkg.version)) published.push({ name: pkg.name, version: pkg.version });
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `packages=${JSON.stringify(published)}\n`);
            console.log(`published ${published.length} package(s):`, JSON.stringify(published));
          '

      # Mirror every published package to GitHub Packages. Runs only when
      # Changesets actually published (so the workspace was built by
      # `bun run release`), and discovers packages from the filesystem — no
      # hardcoded list to drift when packages are added or removed.
      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_PKG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@resq-software:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=$GH_PKG_TOKEN" >> ~/.npmrc
          bash scripts/release/publish-github-packages.sh

  # SBOM + signed build provenance for exactly what was just published. A
  # separate job so only it holds `attestations: write`; it runs only when
  # Changesets actually published.
  attest:
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write # attach the SBOM to each package's GitHub release
      id-token: write # Sigstore signing for the provenance attestation
      attestations: write # store the attestation
    uses: $/.github/workflows/attest-published.yml
    with:
      packages: ${{ needs.release.outputs.published-packages }}
