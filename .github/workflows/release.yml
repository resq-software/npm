name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Each job declares its own scopes, so the attest job below does not inherit
# the release job's write access to packages and pull requests.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: master
          # zizmor: ignore[artipacked] -- changesets/action needs credentials to push version bumps
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git user
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - uses: ./.github/actions/prepare

      - name: Set up npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc

      - name: Run Changesets
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: "[Release] Version Packages"
          commit-message: "chore: version packages"
          publish-script: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Mirror every published package to GitHub Packages. Runs only when
      # Changesets actually published (so the workspace was built by
      # `bun run release`), and discovers packages from the filesystem — no
      # hardcoded list to drift when packages are added or removed.
      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_PKG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@resq-software:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=$GH_PKG_TOKEN" >> ~/.npmrc
          bash scripts/release/publish-github-packages.sh

  # SBOM + signed build provenance for exactly what was just published. A
  # separate job so only it holds `attestations: write`; it runs only when
  # Changesets actually published.
  attest:
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write # attach the SBOM to each package's GitHub release
      id-token: write # Sigstore signing for the provenance attestation
      attestations: write # store the attestation
    uses: $/.github/workflows/attest-published.yml
    with:
      packages: ${{ needs.release.outputs.published-packages }}
