name: Chromatic

on:
  pull_request:
    paths: ['packages/ui/**']
  push:
    branches:
      - master
    paths: ['packages/ui/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required: Chromatic uses git history to determine which stories changed.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: Build Storybook
        run: bun run build-storybook --quiet
        working-directory: packages/ui
      - name: Run Chromatic
        if: github.actor != 'dependabot[bot]'
        uses: chromaui/action@4cc98810d00b34b8f9e89d454d64a8ac3d088340 # v15
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: packages/ui/storybook-static
          # Auto-accept changes when merging into master (sets new baseline).
          autoAcceptChanges: "master"
