name: Chromatic

on:
  pull_request:
    paths: ['packages/ui/**']
  push:
    branches:
      - master
    paths: ['packages/ui/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Required: Chromatic uses git history to determine which stories changed.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: Build Storybook
        run: bun run build-storybook --quiet
        working-directory: packages/ui
      - name: Run Chromatic
        if: github.actor != 'dependabot[bot]'
        uses: chromaui/action@1db61b73b7919508ee8e62336f04bd0aed6da756 # v15
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: packages/ui/storybook-static
          # Auto-accept changes when merging into master (sets new baseline).
          autoAcceptChanges: "master"
