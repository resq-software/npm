#
# Source-of-truth template lives in resq-software/docs:
#   automation/source-repo-templates/api-docs.typescript.yml
#
# Copy this file to resq-software/npm at:
#   .github/workflows/api-docs.yml
#
# Renders TypeDoc API reference for every public @resq-sw/* package
# in the bun monorepo and opens a single PR in resq-software/docs
# with generated MDX under sdks/typescript/api/<pkg>/.

name: api-docs

on:
  push:
    # Tag convention in resq-software/npm is "@resq-sw/<pkg>@v*"
    # (driven by changesets). Trigger on any package release so the
    # docs sync stays current across the monorepo.
    tags:
      - '@resq-sw/*@v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source ref to document (defaults to current ref)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Always cancel an in-flight run when a newer trigger arrives.
  # Each run rewrites the same auto/typescript-api-<ref> branch in
  # the docs repo, so two concurrent runs would race on the force
  # push and could leave the docs PR pointing at stale typedoc
  # output.
  group: api-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OUTPUT_DIR: generated-docs
      DOCS_TARGET: sdks/typescript/api
      # Public packages to document. Discovered manually from
      # `packages/*/package.json` where `private` is false. Update
      # this list when the monorepo gains new public packages.
      PUBLIC_PACKAGES: >-
        analytics
        decorators
        dsa
        helpers
        http
        logger
        rate-limiting
        security
        ui

    steps:
      - name: Resolve ref metadata
        # Single source of truth for the ref this run documents.
        # workflow_dispatch can pass an alternate ref via inputs.ref;
        # fall back to github.ref_name (already stripped of refs/...).
        # DOCS_REF_SLUG is branch-safe for use in PR/branch names
        # (`@resq-sw/ui@v0.35.6` → `resq-sw-ui-v0.35.6`).
        run: |
          raw='${{ inputs.ref || github.ref_name }}'
          raw="${raw#refs/tags/}"
          raw="${raw#refs/heads/}"
          slug="${raw//\//-}"
          slug="${slug//\@/}"
          {
            echo "DOCS_REF_NAME=$raw"
            echo "DOCS_REF_SLUG=$slug"
          } >> "$GITHUB_ENV"

      - name: Checkout source repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Generate per-package TypeDoc output
        # Loop over every public package, install typedoc + the
        # markdown plugin scoped to that package, generate docs, and
        # move the output into OUTPUT_DIR/<pkg>/. A typedoc failure
        # for one package logs a warning and continues; aborting the
        # whole run on one bad package would leave the rest of the
        # docs stale.
        #
        # NOTE on @latest pinning: pinning to a specific typedoc
        # major and a separate plugin major drifts apart over time
        # because the plugin's CategoryRouter import follows typedoc
        # minor versions. Installing the plugin first forces bun to
        # resolve typedoc to a peer-compatible version, then nudging
        # typedoc up keeps it on the latest the plugin allows.
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          rm -rf "${OUTPUT_DIR:?}"/*

          # The typedoc config is identical across packages; write it
          # once to a tmp path and copy into each package dir.
          # Heredoc body lives at column 0 so the bash parser doesn't
          # trip on the indented closing marker (tabs vs spaces).
          tmp_cfg="$(mktemp)"
          cat > "$tmp_cfg" <<'JSON'
          {
            "$schema": "https://typedoc-plugin-markdown.org/schema.json",
            "plugin": ["typedoc-plugin-markdown"],
            "tsconfig": "tsconfig.json",
            "entryPointStrategy": "Expand",
            "entryPoints": ["src"],
            "exclude": [
              "**/*.cy.ts",
              "**/*.test.ts",
              "**/*.test.tsx",
              "**/*.stories.ts",
              "**/*.stories.tsx",
              "**/*.spec.ts",
              "**/*.spec.tsx"
            ],
            "out": "generated-docs",
            "readme": "none",
            "cleanOutputDir": true
          }
          JSON

          generated=0
          for pkg in $PUBLIC_PACKAGES; do
            pkg_dir="packages/$pkg"
            if [ ! -d "$pkg_dir/src" ]; then
              echo "::warning ::skipping $pkg (no src/ at $pkg_dir)"
              continue
            fi
            echo "==> generating $pkg"
            cp "$tmp_cfg" "$pkg_dir/typedoc.docs-site.json"
            (
              cd "$pkg_dir"
              bun add --dev typedoc-plugin-markdown@latest >/dev/null
              bun add --dev typedoc@latest >/dev/null
              rm -rf generated-docs
              bunx typedoc --options typedoc.docs-site.json
            ) || {
              echo "::warning ::typedoc failed for $pkg, skipping"
              continue
            }
            mkdir -p "$OUTPUT_DIR/$pkg"
            cp -R "$pkg_dir/generated-docs/." "$OUTPUT_DIR/$pkg/"
            generated=$((generated + 1))
          done
          if [ "$generated" -eq 0 ]; then
            echo "::error ::no packages generated; aborting empty doc PR"
            exit 1
          fi
          echo "generated $generated packages"

      - name: Rename per-package READMEs to index.md
        # TypeDoc writes `<pkg>/README.md` for each package landing
        # page and `<pkg>/<dir>/README.md` for each module landing.
        # Mintlify's nav resolver expects `<dir>.{md,mdx}` or
        # `<dir>/index.{md,mdx}` for a registered page id like
        # `<dir>`; `<dir>/README.md` is a Hugo convention that
        # Mintlify doesn't natively pick up. Without this rename,
        # registering `<dir>` produces a "file does not exist"
        # warning on every dev start and the URL `/<dir>` 307s to
        # the first leaf instead of rendering the README content.
        #
        # Rename ALL READMEs in the multi-package layout. There's no
        # top-level README in OUTPUT_DIR yet — the "Write top-level
        # index" step writes that as README.mdx separately.
        # Also rewrite any in-content `README.md` references to
        # `index.md` so cross-links keep working.
        working-directory: ${{ env.OUTPUT_DIR }}
        run: |
          find . -type f -name 'README.md' -print0 \
            | while IFS= read -r -d '' f; do
              mv "$f" "$(dirname "$f")/index.md"
            done
          find . -type f -name '*.md' -print0 | while IFS= read -r -d '' f; do
            sed -E -i \
              's|\]\(([^)]*)README\.md(#[^)]*)?\)|](\1index.md\2)|g' \
              "$f"
          done

      - name: Inject per-package version banners
        # Each `<pkg>/index.md` (the package landing page) gets a
        # banner showing the version from packages/<pkg>/package.json
        # and the source ref, matching the pattern used by the .NET
        # and Python templates. Inserted after the file's first H1.
        env:
          PKG_REF: ${{ env.DOCS_REF_NAME }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          ref_name = os.environ.get("PKG_REF", "main")
          repo = os.environ.get("GH_REPO", "")
          out = pathlib.Path(os.environ["OUTPUT_DIR"])

          for pkg_dir in sorted(out.iterdir()):
              if not pkg_dir.is_dir():
                  continue
              landing = pkg_dir / "index.md"
              if not landing.is_file():
                  continue
              pkg_json = pathlib.Path("packages") / pkg_dir.name / "package.json"
              version = "unknown"
              if pkg_json.exists():
                  try:
                      version = json.loads(
                          pkg_json.read_text(encoding="utf-8")
                      ).get("version", "unknown")
                  except json.JSONDecodeError:
                      pass
              banner = (
                  f"> **Version:** `v{version}` · **Ref:** `{ref_name}` · "
                  f"**Source:** [`{repo}`](https://github.com/{repo})\n\n"
              )
              text = landing.read_text(encoding="utf-8")
              h1 = re.match(r"(# [^\n]+\n+)", text)
              if h1:
                  text = text[: h1.end()] + banner + text[h1.end():]
              else:
                  text = banner + text
              landing.write_text(text, encoding="utf-8")
          PY

      - name: Prefix bare relative .md links with ./
        # TypeDoc emits cross-references as bare relative paths,
        # both single-segment (`PaginationLink.md`) and multi-segment
        # (`functions/Accordion.md`, `accordion/index.md`). Mintlify
        # only resolves explicitly-relative paths (./, ../) and
        # absolute paths (/...) — bare paths are flagged as broken.
        #
        # Skip targets that are already qualified: external URLs,
        # already-relative paths, fragment-only links, and special
        # schemes (mailto:, data:, etc.). A target is "qualified"
        # iff it starts with `./`, `../`, `/`, `#`, or contains `:`
        # before the first `/`.
        working-directory: ${{ env.OUTPUT_DIR }}
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          link_re = re.compile(r'(?<!\!)\[([^\]]*)\]\(([^)]+)\)')

          def is_qualified(target: str) -> bool:
              t = target.strip().split(None, 1)[0]
              if t.startswith(("./", "../", "/", "#")):
                  return True
              if ":" in t.split("/", 1)[0]:
                  return True
              return False

          for f in pathlib.Path(".").rglob("*.md"):
              text = f.read_text(encoding="utf-8")
              def fix(m: re.Match) -> str:
                  label, target = m.group(1), m.group(2)
                  if is_qualified(target):
                      return m.group(0)
                  if not target.endswith(".md") and ".md#" not in target:
                      return m.group(0)
                  return f"[{label}](./{target})"
              new = link_re.sub(fix, text)
              if new != text:
                  f.write_text(new, encoding="utf-8")
          PY

      - name: Strip TypeDoc breadcrumb header
        # Every typedoc-plugin-markdown page begins with a breadcrumb
        # block that links to ../../README.md and similar paths.
        # Mintlify's broken-links check rejects these because the
        # README files are not registered in docs.json navigation.
        # Drop everything before the first "# " heading on each file
        # (typedoc emits exactly one top-level heading per page).
        # Files without a heading are left untouched.
        working-directory: ${{ env.OUTPUT_DIR }}
        run: |
          find . -type f -name '*.md' -print0 | while IFS= read -r -d '' f; do
            if grep -q '^# ' "$f"; then
              awk '/^# / { found=1 } found { print }' "$f" > "$f.tmp" \
                && mv "$f.tmp" "$f"
            fi
          done

      - name: Escape curly braces outside code regions (MDX safety)
        # Mintlify parses .md as MDX. Literal `{ ... }` in JSDoc
        # prose looks like a JSX expression to acorn and fails the
        # broken-links check. Walk every generated .md, track both
        # triple-backtick fences and single-backtick inline spans,
        # and rewrite curly braces to HTML entities only on prose
        # outside any code region.
        #
        # Inline code spans matter because TypeDoc commonly emits
        # things like `\`type T = { id: string }\`` in JSDoc, and
        # escaping the braces there causes &#123; to render
        # literally inside `<code>` tags in the browser.
        working-directory: ${{ env.OUTPUT_DIR }}
        run: |
          find . -type f -name '*.md' -print0 | while IFS= read -r -d '' f; do
            awk '
              BEGIN { in_fence = 0 }
              /^```/ { in_fence = !in_fence; print; next }
              {
                if (in_fence) { print; next }
                out = ""
                in_inline_code = 0
                n = length($0)
                for (i = 1; i <= n; i++) {
                  c = substr($0, i, 1)
                  if (c == "`") {
                    in_inline_code = !in_inline_code
                    out = out c
                  } else if (!in_inline_code && c == "{") {
                    out = out "&#123;"
                  } else if (!in_inline_code && c == "}") {
                    out = out "&#125;"
                  } else {
                    out = out c
                  }
                }
                print out
              }
            ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Write top-level index
        # Stitch a small README.mdx at the top of OUTPUT_DIR listing
        # all generated packages with their pinned versions. This is
        # what users land on when clicking "TypeScript" in the
        # Generated Package References sidebar group.
        #
        # Emit .mdx (not .md) because Mintlify's docs.json nav
        # resolver only matches .mdx for explicitly-registered page
        # ids; the splice registers `sdks/typescript/api/README` as
        # the language sub-group's first page.
        env:
          PKG_REF: ${{ env.DOCS_REF_NAME }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY' > "$OUTPUT_DIR/README.mdx"
          import json
          import os
          import pathlib

          ref_name = os.environ.get("PKG_REF", "main")
          repo = os.environ.get("GH_REPO", "")
          out = pathlib.Path(os.environ["OUTPUT_DIR"])

          def read_version(pkg: str) -> str:
              pkg_json = pathlib.Path("packages") / pkg / "package.json"
              if not pkg_json.exists():
                  return "unknown"
              try:
                  return json.loads(
                      pkg_json.read_text(encoding="utf-8")
                  ).get("version", "unknown")
              except json.JSONDecodeError:
                  return "unknown"

          print("# ResQ TypeScript SDK")
          print()
          print(
              f"Auto-generated reference for "
              f"[`{repo}`](https://github.com/{repo}) "
              f"at ref `{ref_name}`."
          )
          print()
          print("## Packages")
          print()
          for pkg_dir in sorted(out.iterdir()):
              if not pkg_dir.is_dir():
                  continue
              version = read_version(pkg_dir.name)
              print(f"- `@resq-sw/{pkg_dir.name}` — `v{version}`")
          PY

      - name: Build pages index
        # Flat JSON array of generated Markdown paths (without
        # extension) so the docs repo can later splice them into
        # docs.json automatically. Mintlify resolves both .md and
        # .mdx, and typedoc-plugin-markdown emits .md by default,
        # so we keep the .md output and skip a rename step.
        working-directory: ${{ env.OUTPUT_DIR }}
        run: |
          find . -name '*.md' -type f \
            | sed 's|^\./||; s|\.md$||' \
            | sort > _pages.txt
          jq -R -s 'split("\n") | map(select(length > 0))' _pages.txt > _pages.json
          rm _pages.txt

      - name: Checkout docs repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: resq-software/docs
          path: docs-checkout
          token: ${{ secrets.DOCS_REPO_PR_TOKEN }}
          # peter-evans/create-pull-request also sets an Authorization
          # extraheader; persisting credentials here too produces a
          # "Duplicate header: Authorization" 400 from GitHub. Let the
          # PR action manage its own auth.
          persist-credentials: false

      - name: Sync generated MDX into docs checkout
        run: |
          target="docs-checkout/${DOCS_TARGET}"
          mkdir -p "$target"
          rm -rf "${target:?}"/*
          cp -R "${OUTPUT_DIR}/." "$target/"

      - name: Splice _pages.json into docs.json nav
        # Mintlify only routes pages registered in docs.json. The
        # _pages.json artifact lists every generated Markdown path;
        # rewrite the matching language sub-group under the
        # 'Generated Package References' group so all pages are
        # discoverable, in-content cross-links resolve, and direct
        # URLs work. Each top-level dir under sdks/typescript/api/
        # becomes its own collapsible package group.
        working-directory: docs-checkout
        run: |
          python3 - <<'PYINNER'
          import json
          import pathlib

          PREFIX = "sdks/typescript/api"
          LANG_LABEL = "TypeScript"

          docs_path = pathlib.Path("docs.json")
          docs = json.loads(docs_path.read_text())
          pages_path = pathlib.Path(PREFIX) / "_pages.json"
          if not pages_path.exists():
              raise SystemExit(f"missing {pages_path}")
          raw = json.loads(pages_path.read_text())

          tree: dict = {}

          def insert(node, parts, full_id):
              if len(parts) == 1:
                  node.setdefault("_files", []).append((parts[0], full_id))
                  return
              head, *rest = parts
              insert(node.setdefault("_dirs", {}).setdefault(head, {}), rest, full_id)

          for p in raw:
              if p in ("README", "index"):
                  continue
              # Each subdir's landing page is `<dir>/index.md` (after
              # the rename step above) which Mintlify natively
              # resolves from page id `<dir>`. Strip the `/index`
              # suffix when building the registered path so the URL
              # stays clean (`/<dir>` not `/<dir>/index`). Same
              # principle applied to legacy `/README` entries in
              # case any downstream tool still emits them.
              if p.endswith("/index") or p.endswith("/README"):
                  bare = p.rsplit("/", 1)[0]
                  full_id = f"{PREFIX}/{bare}"
                  parts = bare.split("/")
              else:
                  full_id = f"{PREFIX}/{p}"
                  parts = p.split("/")
              insert(tree, parts, full_id)

          def to_mintlify(node, group_name):
              pages = []
              for fname, full_id in sorted(node.get("_files", [])):
                  pages.append(full_id)
              for dname, sub in sorted(node.get("_dirs", {}).items()):
                  pages.append(to_mintlify(sub, dname))
              return pages if group_name is None else {"group": group_name, "pages": pages}

          new_pages = [f"{PREFIX}/README"] + to_mintlify(tree, None)

          en = next(l for l in docs["navigation"]["languages"] if l["language"] == "en")
          sdks_tab = next(t for t in en["tabs"] if t["tab"] == "SDKs")
          gen_group = next(g for g in sdks_tab["groups"] if g["group"] == "Generated Package References")
          for sub in gen_group["pages"]:
              if isinstance(sub, dict) and sub.get("group") == LANG_LABEL:
                  sub["pages"] = new_pages
                  break
          else:
              gen_group["pages"].append({"group": LANG_LABEL, "pages": new_pages})

          docs_path.write_text(json.dumps(docs, indent=2, ensure_ascii=False))
          print(f"Updated {LANG_LABEL} sub-group with {len(raw)} pages")
          PYINNER

      - name: Open PR in docs repo
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          path: docs-checkout
          token: ${{ secrets.DOCS_REPO_PR_TOKEN }}
          # Attribute commits to the org's bot account. Requires
          # engineer@resq.software to be a verified email on
          # https://github.com/resq-sw, otherwise GitHub will mark
          # the commit as unverified-author.
          author: 'resq-sw <engineer@resq.software>'
          committer: 'resq-sw <engineer@resq.software>'
          commit-message: |
            docs(typescript): sync API reference for ${{ env.DOCS_REF_NAME }}
          title: 'docs(typescript): API reference ${{ env.DOCS_REF_NAME }}'
          body: |
            Auto-generated by `${{ github.workflow }}` in
            `${{ github.repository }}` for ref `${{ env.DOCS_REF_NAME }}`
            (run: ${{ github.run_id }}).

            Regenerated files under `sdks/typescript/api/`. One
            sub-directory per `@resq-sw/*` package. Review the diff
            for unintended exports and merge to publish.
          branch: auto/typescript-api-${{ env.DOCS_REF_SLUG }}
          base: main
          delete-branch: true
          add-paths: |
            sdks/typescript/api/**
            docs.json
          labels: |
            automated
            docs:api-ref
            language:typescript
