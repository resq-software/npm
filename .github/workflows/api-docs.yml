#
# Source-of-truth template lives in resq-software/docs:
#   automation/source-repo-templates/api-docs.typescript.yml
#
# Copy this file to resq-software/npm at:
#   .github/workflows/api-docs.yml
#
# Renders TypeDoc API reference for @resq-sw/ui and opens a PR in
# resq-software/docs with generated MDX under sdks/typescript/api/.
#
# The npm repo is a bun monorepo. Today this workflow only documents
# the @resq-sw/ui package because that is the surface mapped by
# sdks/typescript in the docs site. Add a matrix when other packages
# get their own SDK pages.

name: api-docs

on:
  push:
    # Tag convention in resq-software/npm is "@resq-sw/<pkg>@v*"
    # (driven by changesets). Only ui releases trigger a docs sync.
    tags:
      - '@resq-sw/ui@v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source ref to document (defaults to current ref)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Always cancel an in-flight run when a newer trigger arrives.
  # Each run rewrites the same auto/typescript-api-<ref> branch in
  # the docs repo, so two concurrent runs would race on the force
  # push and could leave the docs PR pointing at stale typedoc
  # output.
  group: api-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PKG_DIR: packages/ui
      DOCS_TARGET: sdks/typescript/api

    steps:
      - name: Checkout source repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Install TypeDoc + Markdown plugin (scoped to ui pkg)
        # NOTE on @latest: the obvious advice is to pin to a specific
        # major (e.g. typedoc@^0.28, typedoc-plugin-markdown@^4) so
        # CI is reproducible. We tried that first and hit a peer-dep
        # alignment failure: the plugin's CategoryRouter import
        # requires a typedoc minor that was newer than what `^0.27`
        # resolved to, breaking plugin load with a SyntaxError. Until
        # one of the two packages cuts a major, the safest pin is to
        # take whatever the plugin's peerDependency happens to want.
        # Installing the plugin FIRST forces bun to resolve typedoc
        # to a compatible version; the second `bun add` only nudges
        # typedoc upward if the plugin's peer range allows it.
        working-directory: ${{ env.PKG_DIR }}
        run: |
          bun add --dev typedoc-plugin-markdown@latest
          bun add --dev typedoc@latest

      - name: Write docs-site TypeDoc config
        # The package's checked-in typedoc.json uses
        # typedoc-github-wiki-theme, which produces sidebar files that
        # do not render cleanly in Mintlify. Write a sibling config
        # tailored for the docs site so we never load the wiki theme.
        # Only options accepted by typedoc core are listed here;
        # plugin-specific options (e.g. fileExtension) shifted between
        # plugin majors and broke the build last time.
        working-directory: ${{ env.PKG_DIR }}
        run: |
          cat > typedoc.docs-site.json <<'JSON'
          {
            "$schema": "https://typedoc-plugin-markdown.org/schema.json",
            "plugin": ["typedoc-plugin-markdown"],
            "tsconfig": "tsconfig.json",
            "entryPointStrategy": "Expand",
            "entryPoints": ["src"],
            "exclude": [
              "**/*.cy.ts",
              "**/*.test.ts",
              "**/*.test.tsx",
              "**/*.stories.ts",
              "**/*.stories.tsx",
              "**/*.spec.ts",
              "**/*.spec.tsx"
            ],
            "out": "generated-docs",
            "readme": "none",
            "cleanOutputDir": true
          }
          JSON

      - name: Generate API reference
        working-directory: ${{ env.PKG_DIR }}
        run: |
          rm -rf generated-docs
          bunx typedoc --options typedoc.docs-site.json

      - name: Convert top-level README to .mdx + plain-text module list
        # Mintlify's docs.json nav resolver only matches .mdx for
        # page ids, so the nav-registered README must be .mdx.
        # Cross-page links from a .mdx parent require nav
        # registration (a constraint the auto-generated tree of
        # 3500+ pages cannot satisfy); strip the typedoc-emitted
        # `[components/X](X/README.md)` module list down to plain
        # backticked text. Users navigate to specific pages via
        # the URL bar.
        working-directory: ${{ env.PKG_DIR }}/generated-docs
        run: |
          if [ -f README.md ]; then
            python3 - <<'PY'
          import pathlib, re
          INTERNAL_LINK = re.compile(r'\[([^\]]+)\]\((?!https?://|mailto:|#)[^)]+\)')
          p = pathlib.Path("README.md")
          text = p.read_text(encoding="utf-8")
          text = INTERNAL_LINK.sub(r'`\1`', text)
          # Collapse accidental double-backticks from already-
          # backticked link text.
          text = text.replace("``", "`")
          pathlib.Path("README.mdx").write_text(text, encoding="utf-8")
          p.unlink()
          PY
          fi

      - name: Prefix bare-filename intra-page links with ./
        # TypeDoc emits same-directory cross-references as bare
        # filenames, e.g. `[PaginationLink](PaginationLink.md)`.
        # Mintlify accepts `(../foo/bar.md)` but rejects bare
        # filenames as broken. Prefix any bare-filename `.md` link
        # with `./` so the resolver keeps it as a relative path.
        # External URLs (https://...) and already-relative paths
        # (./, ../) are left alone because the leading-char class
        # `[A-Za-z0-9]` excludes both. Including digits handles
        # files that start with a digit (e.g. 01-introduction.md)
        # if any future tooling generates them.
        working-directory: ${{ env.PKG_DIR }}/generated-docs
        run: |
          find . -type f -name '*.md' -print0 | while IFS= read -r -d '' f; do
            sed -E -i \
              's|\]\(([A-Za-z0-9][^)/]*\.md(#[^)]*)?)\)|](./\1)|g' \
              "$f"
          done

      - name: Strip TypeDoc breadcrumb header
        # Every typedoc-plugin-markdown page begins with a breadcrumb
        # block that links to ../../README.md and similar paths.
        # Mintlify's broken-links check rejects these because the
        # README files are not registered in docs.json navigation.
        # Drop everything before the first "# " heading on each file
        # (typedoc emits exactly one top-level heading per page).
        # Files without a heading are left untouched.
        working-directory: ${{ env.PKG_DIR }}/generated-docs
        run: |
          find . -type f -name '*.md' -print0 | while IFS= read -r -d '' f; do
            if grep -q '^# ' "$f"; then
              awk '/^# / { found=1 } found { print }' "$f" > "$f.tmp" \
                && mv "$f.tmp" "$f"
            fi
          done

      - name: Escape curly braces outside code regions (MDX safety)
        # Mintlify parses .md as MDX. Literal `{ ... }` in JSDoc
        # prose looks like a JSX expression to acorn and fails the
        # broken-links check. Walk every generated .md, track both
        # triple-backtick fences and single-backtick inline spans,
        # and rewrite curly braces to HTML entities only on prose
        # outside any code region.
        #
        # Inline code spans matter because TypeDoc commonly emits
        # things like `\`type T = { id: string }\`` in JSDoc, and
        # escaping the braces there causes &#123; to render
        # literally inside `<code>` tags in the browser.
        working-directory: ${{ env.PKG_DIR }}/generated-docs
        run: |
          find . -type f -name '*.md' -print0 | while IFS= read -r -d '' f; do
            awk '
              BEGIN { in_fence = 0 }
              /^```/ { in_fence = !in_fence; print; next }
              {
                if (in_fence) { print; next }
                out = ""
                in_inline_code = 0
                n = length($0)
                for (i = 1; i <= n; i++) {
                  c = substr($0, i, 1)
                  if (c == "`") {
                    in_inline_code = !in_inline_code
                    out = out c
                  } else if (!in_inline_code && c == "{") {
                    out = out "&#123;"
                  } else if (!in_inline_code && c == "}") {
                    out = out "&#125;"
                  } else {
                    out = out c
                  }
                }
                print out
              }
            ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Build pages index
        # Flat JSON array of generated Markdown paths (without
        # extension) so the docs repo can later splice them into
        # docs.json automatically. Mintlify resolves both .md and
        # .mdx, and typedoc-plugin-markdown emits .md by default,
        # so we keep the .md output and skip a rename step.
        working-directory: ${{ env.PKG_DIR }}/generated-docs
        run: |
          find . -name '*.md' -type f \
            | sed 's|^\./||; s|\.md$||' \
            | sort > _pages.txt
          jq -R -s 'split("\n") | map(select(length > 0))' _pages.txt > _pages.json
          rm _pages.txt

      - name: Checkout docs repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: resq-software/docs
          path: docs-checkout
          token: ${{ secrets.DOCS_REPO_PR_TOKEN }}
          # peter-evans/create-pull-request also sets an Authorization
          # extraheader; persisting credentials here too produces a
          # "Duplicate header: Authorization" 400 from GitHub. Let the
          # PR action manage its own auth.
          persist-credentials: false

      - name: Sync generated MDX into docs checkout
        run: |
          target="docs-checkout/${DOCS_TARGET}"
          mkdir -p "$target"
          rm -rf "${target:?}"/*
          cp -R "${PKG_DIR}/generated-docs/." "$target/"

      - name: Splice _pages.json into docs.json nav
        # Mintlify only routes pages registered in docs.json. The
        # _pages.json artifact lists every generated Markdown path;
        # rewrite the matching language sub-group under the
        # 'Generated API Reference' group so all pages are
        # discoverable, in-content cross-links resolve, and direct
        # URLs work.
        working-directory: docs-checkout
        run: |
          python3 - <<'PYINNER'
          import json
          import pathlib

          PREFIX = "sdks/typescript/api"
          LANG_LABEL = "TypeScript"

          docs_path = pathlib.Path("docs.json")
          docs = json.loads(docs_path.read_text())
          pages_path = pathlib.Path(PREFIX) / "_pages.json"
          if not pages_path.exists():
              raise SystemExit(f"missing {pages_path}")
          raw = json.loads(pages_path.read_text())

          # Build hierarchical groups by path segments. Each
          # `<dir>/README` becomes the dir's group entry rather than
          # a duplicate leaf.
          tree: dict = {}

          def insert(node, parts, full_id):
              if len(parts) == 1:
                  node.setdefault("_files", []).append((parts[0], full_id))
                  return
              head, *rest = parts
              insert(node.setdefault("_dirs", {}).setdefault(head, {}), rest, full_id)

          for p in raw:
              if p == "README":
                  continue
              # Mintlify auto-redirects `/path/README` to `/path`, so
              # register the directory form (page id without trailing
              # /README). Files that don't end in /README keep their
              # path verbatim.
              if p.endswith("/README"):
                  full_id = f"{PREFIX}/{p[: -len('/README')]}"
                  parts = full_id[len(PREFIX) + 1:].split("/")
              else:
                  full_id = f"{PREFIX}/{p}"
                  parts = p.split("/")
              insert(tree, parts, full_id)

          def to_mintlify(node, group_name):
              pages = []
              for fname, full_id in sorted(node.get("_files", [])):
                  pages.append(full_id)
              for dname, sub in sorted(node.get("_dirs", {}).items()):
                  pages.append(to_mintlify(sub, dname))
              return pages if group_name is None else {"group": group_name, "pages": pages}

          new_pages = [f"{PREFIX}/README"] + to_mintlify(tree, None)

          en = next(l for l in docs["navigation"]["languages"] if l["language"] == "en")
          sdks_tab = next(t for t in en["tabs"] if t["tab"] == "SDKs")
          gen_group = next(g for g in sdks_tab["groups"] if g["group"] == "Generated API Reference")
          for sub in gen_group["pages"]:
              if isinstance(sub, dict) and sub.get("group") == LANG_LABEL:
                  sub["pages"] = new_pages
                  break
          else:
              gen_group["pages"].append({"group": LANG_LABEL, "pages": new_pages})

          docs_path.write_text(json.dumps(docs, indent=2, ensure_ascii=False))
          print(f"Updated {LANG_LABEL} sub-group with {len(raw)} pages")
          PYINNER

      - name: Open PR in docs repo
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          path: docs-checkout
          token: ${{ secrets.DOCS_REPO_PR_TOKEN }}
          # Attribute commits to the org's bot account. Requires
          # engineer@resq.software to be a verified email on
          # https://github.com/resq-sw, otherwise GitHub will mark
          # the commit as unverified-author.
          author: 'resq-sw <engineer@resq.software>'
          committer: 'resq-sw <engineer@resq.software>'
          commit-message: |
            docs(ui): sync API reference for ${{ github.ref_name }}
          title: 'docs(ui): API reference ${{ github.ref_name }}'
          body: |
            Auto-generated by `${{ github.workflow }}` in
            `${{ github.repository }}` for ref `${{ github.ref_name }}`
            (run: ${{ github.run_id }}).

            Regenerated files under `sdks/typescript/api/`. Review the
            diff for unintended exports and merge to publish.
          branch: auto/typescript-api-${{ github.ref_name }}
          base: main
          delete-branch: true
          add-paths: |
            sdks/typescript/api/**
            docs.json
          labels: |
            automated
            docs:api-ref
            language:typescript
