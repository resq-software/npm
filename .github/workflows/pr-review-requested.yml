name: PR Review Requested

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- needs write access; guarded by same-repo check
    types:
      - review_requested

permissions:
  pull-requests: write

jobs:
  pr_review_requested:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Remove "waiting for author" label
        # Use the runner's built-in gh CLI instead of a third-party action
        # (zizmor superfluous-actions, alert #53). `|| true` keeps this
        # non-fatal when the label isn't currently applied to the PR.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --remove-label "status: waiting for author" || true
