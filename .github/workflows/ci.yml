name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Detect which packages changed ─────────────────────────────────────

  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      any: ${{ steps.detect.outputs.any }}
      ui: ${{ steps.detect.outputs.ui }}
      # `any` is derived purely from packages/*, so a PR touching only examples/**
      # leaves it false and every job gated on it skips — including the one meant to
      # keep the examples compiling. Tracked separately so example-only changes are
      # still checked.
      examples: ${{ steps.detect.outputs.examples }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        name: Detect changed packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            BASE="$EVENT_BEFORE"
          else
            BASE="$PR_BASE_SHA"
          fi

          if [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="HEAD~1"
          fi

          # Dependency graph: when a package changes, also build+test the
          # packages that depend on it. Derived from each package's internal
          # `@resq-systems/*` deps (dependencies + peer + dev) so it can never
          # drift out of date as packages are added or rewired.
          declare -A DEPENDENTS
          # The `${...}` inside the single-quoted `node -e` script below is JS,
          # not shell, so it is meant to stay literal — SC2016 is a false positive.
          # shellcheck disable=SC2016
          while IFS=$'\t' read -r consumer dep; do
            DEPENDENTS[$dep]="${DEPENDENTS[$dep]:-} $consumer"
          done < <(node -e '
            const fs = require("node:fs");
            for (const dir of fs.readdirSync("packages")) {
              const manifest = `packages/${dir}/package.json`;
              if (!fs.existsSync(manifest)) continue;
              const pkg = JSON.parse(fs.readFileSync(manifest, "utf8"));
              const deps = { ...pkg.dependencies, ...pkg.peerDependencies, ...pkg.devDependencies };
              for (const name of Object.keys(deps)) {
                const m = name.match(/^@resq-systems\/(.+)$/);
                if (m && m[1] !== dir) process.stdout.write(`${dir}\t${m[1]}\n`);
              }
            }
          ')

          CHANGED=()
          for dir in packages/*/; do
            [ ! -d "$dir" ] && continue
            pkg=$(basename "$dir")
            [ ! -f "${dir}package.json" ] && continue
            if git diff --name-only "$BASE" HEAD -- "$dir" | grep -q .; then
              CHANGED+=("$pkg")
            fi
          done

          # Also trigger all packages if root configs changed
          if git diff --name-only "$BASE" HEAD -- 'biome.json' 'tsconfig*.json' 'package.json' 'bun.lock' | grep -q .; then
            for dir in packages/*/; do
              pkg=$(basename "$dir")
              [ -f "${dir}package.json" ] && CHANGED+=("$pkg")
            done
          fi

          # Add dependents of changed packages
          FULL=()
          for pkg in "${CHANGED[@]}"; do
            FULL+=("$pkg")
            deps="${DEPENDENTS[$pkg]:-}"
            if [ -n "$deps" ]; then
              for dep in $deps; do
                FULL+=("$dep")
              done
            fi
          done

          # Deduplicate and filter to packages with build+test scripts
          PACKAGES='[]'
          declare -A SEEN
          for pkg in "${FULL[@]}"; do
            [ -n "${SEEN[$pkg]:-}" ] && continue
            SEEN[$pkg]=1
            pkg_json="packages/$pkg/package.json"
            [ ! -f "$pkg_json" ] && continue
            has_build=$(node -e "const p=require('./$pkg_json'); process.stdout.write(p.scripts?.build ? '1' : '0')")
            has_test=$(node -e "const p=require('./$pkg_json'); process.stdout.write(p.scripts?.test ? '1' : '0')")
            if [ "$has_build" = "1" ] && [ "$has_test" = "1" ]; then
              PACKAGES=$(echo "$PACKAGES" | node -e "
                const p = JSON.parse(require('fs').readFileSync(0, 'utf8'));
                p.push('$pkg');
                process.stdout.write(JSON.stringify(p));
              ")
            fi
          done

          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "any=$( [ "$PACKAGES" != '[]' ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

          # Independent of $PACKAGES: an example-only PR changes no package, so `any`
          # stays false and a job gated on it never runs.
          if git diff --name-only "$BASE" HEAD -- 'examples/' | grep -q .; then
            echo "examples=true" >> "$GITHUB_OUTPUT"
          else
            echo "examples=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$PACKAGES" | node -e "process.exit(JSON.parse(require('fs').readFileSync(0,'utf8')).includes('ui') ? 0 : 1)"; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Changed packages: $PACKAGES"

  # ── Workspace-wide lint ───────────────────────────────────────────────

  lint:
    name: Lint
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/prepare
      # Repo-wide, not packages/ui. Scoped to one package this missed every root file
      # and every other package, which is what let a formatting violation in
      # .github/aw/actions-lock.json reach the Release job's push and block a release.
      # Lint is the right place for that to surface; a pre-push hook is not.
      - name: Biome
        run: bunx biome ci .
      - name: "No workspace: protocol in published deps"
        run: node scripts/check-no-workspace-protocol.mjs

  # ── Build all changed packages ────────────────────────────────────────

  build:
    name: Build (${{ matrix.package }})
    needs: detect
    if: needs.detect.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: Build workspace
        run: bun run build
      - name: Verify package build
        env:
          PKG: ${{ matrix.package }}
        run: |
          if [ ! -d "packages/$PKG/lib" ]; then
            echo "❌ Build output missing: packages/$PKG/lib"
            exit 1
          fi
          echo "✅ Build output OK"

  # ── Test all changed packages ─────────────────────────────────────────

  test:
    name: Test (${{ matrix.package }})
    needs: detect
    if: needs.detect.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: Build workspace dependencies
        run: bun run build
      - name: Run tests
        run: bun run test
        working-directory: packages/${{ matrix.package }}
      # The upload below had never had a file to send: packages/ui's test script carried
      # no --coverage, and codecov-action leaves `fail_ci_if_error` false by default, so
      # its CLI printed "no coverage reports found" and the step still succeeded. Assert
      # the artefact here instead - this fails offline, names the likely cause, and does
      # not depend on codecov.io being reachable.
      #
      # Deliberately not `always()`: an `if:` with no status function implies `success()`,
      # so a genuine test failure skips this and leaves one red step instead of two.
      - if: matrix.package == 'ui'
        name: Assert coverage report was written
        run: |
          set -eu
          LCOV=packages/ui/coverage/lcov.info
          if [ ! -s "$LCOV" ]; then
            echo "::error::$LCOV is missing or empty - did packages/ui lose --coverage?"
            exit 1
          fi
          # grep -c prints 0 and exits 1 on no match, so the count is taken on its own and
          # validated as a number: the first draft of this guard appended a second 0, which
          # made `[` fail, which under `set -e` inside an `if` condition passed silently -
          # the exact shape of bug this step exists to catch.
          FILES=$(grep -c '^SF:' "$LCOV" || true)
          case $FILES in
            '' | *[!0-9]*)
              echo "::error::could not count SF: records in $LCOV"
              exit 1
              ;;
          esac
          # A smoke floor, not a second coverage threshold: it catches a reporter that
          # emitted a stub, which would upload as near-0%, without churning as files are
          # added. The real count is ~175.
          if [ "$FILES" -lt 100 ]; then
            echo "::error::$LCOV covers only $FILES files - expected the whole src tree"
            exit 1
          fi
          # File count alone cannot catch a coverage COLLAPSE: `coverage.all: true`
          # lists every source file whether or not a test ever touched it, so a run
          # that collected no tests still emits ~175 SF: records and would pass the
          # check above while uploading near-0%. Gate on executed lines too.
          HITS=$(awk -F, '/^DA:/ && $2 > 0 { n++ } END { print n+0 }' "$LCOV" || true)
          case $HITS in
            '' | *[!0-9]*)
              echo "::error::could not count executed lines in $LCOV"
              exit 1
              ;;
          esac
          # Floor set from measurement, not guesswork: a healthy report records 1926
          # executed lines. 1000 leaves room for the suite to shrink legitimately
          # while still catching a collapse, which lands near zero.
          if [ "$HITS" -lt 1000 ]; then
            echo "::error::$LCOV records only $HITS executed lines - the suite likely collected no tests"
            exit 1
          fi
          echo "$LCOV: $FILES files, $(wc -c <"$LCOV") bytes"
      # `always()` dropped here too. Vitest's `reportOnFailure` is off, so a failed run
      # writes no lcov at all and uploading on red could only ever add a second failing
      # step to an already-red job.
      #
      # `fail_ci_if_error` is left at its default and written out so it reads as a choice:
      # there is no CODECOV_TOKEN, uploads are tokenless and rate-limited, and a fork PR
      # cannot be given one, so making codecov.io availability fatal would be flake rather
      # than signal. The step above is the gate for a missing report. Flip this to true
      # once the secret exists.
      - if: matrix.package == 'ui'
        name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # `files` is additive on its own; disable_search is what turns a relocated report
          # into an error rather than a silent upload of whatever else was found.
          disable_search: true
          fail_ci_if_error: false
          files: packages/ui/coverage/lcov.info
          flags: ui
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Type-check all changed packages ───────────────────────────────────

  typecheck:
    name: Type Check (${{ matrix.package }})
    needs: detect
    if: needs.detect.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: Build workspace dependencies
        run: bun run build
      - name: Type check
        run: bunx tsc --noEmit
        working-directory: packages/${{ matrix.package }}

  # ── Examples ──────────────────────────────────────────────────────────
  # The examples are workspace members but declared no build or test script, so
  # `bun --filter '*' build|test` skipped them and nothing type-checked them. They
  # were free to rot, and wiring this up immediately proved it: `dsa-pathfinding`
  # imported `Coordinates2D`, a type `@resq-systems/dsa` had never exported.
  examples:
    name: Examples
    needs: detect
    # Either trigger: a package change can break an example that consumes it, and an
    # example-only change is the case this job exists for. Gating on `any` alone would
    # have skipped exactly the second one.
    if: needs.detect.outputs.any == 'true' || needs.detect.outputs.examples == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: Build workspace dependencies
        run: bun run build
      - name: Type check examples
        run: bun --filter './examples/*' typecheck

  # ── Changeset status (PR only) ────────────────────────────────────────

  changeset:
    name: Changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: Check for changeset
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          STATUS=$(bunx changeset status --since "origin/$PR_BASE_REF" 2>&1) || true
          echo "$STATUS"
          if echo "$STATUS" | grep -q "No changesets present"; then
            echo ""
            echo "⚠️  No changeset found. If this PR changes package behavior, run:"
            echo "   bun changeset"
            echo ""
            echo "Skip this check if the PR is docs/ci/test only."
          fi

  # ── UI-specific jobs ──────────────────────────────────────────────────

  storybook:
    name: Storybook
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - run: bun run build-storybook
        working-directory: packages/ui

  # Renders all 374 stories through axe-core. Opt-in behind A11Y_AUDIT in the test
  # file because it costs ~30s against a 14s unit suite; see a11y-audit.test.ts.
  #
  # Its own job rather than a step in `test (ui)`: the audit needs the workspace
  # built, so folding it in would serialise it behind the unit suite and leave one
  # red check meaning either. A separate context names which one broke.
  a11y:
    name: Accessibility audit
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      # contact-scope.tsx imports @resq-systems/nav/arpa at runtime, so without a
      # build the suite fails to collect — it does not run with a silent gap, but
      # the failure reads as unrelated.
      - name: Build workspace dependencies
        run: bun run build
      - name: Run axe over every story
        run: bun run a11y
        working-directory: packages/ui
      # The assertion message truncates each finding to 200 characters, and
      # renderErrors plus the captured console noise appear only in the report.
      # `always()` because a failing run is exactly when it gets read.
      #
      # `if-no-files-found: error` rather than `warn` on purpose: the report is
      # written before the assertions, so the case it catches is a *passing* run
      # that produced no report — a broken A11Y_REPORT_PATH, which would quietly
      # turn the artefact into nothing. It costs a second red step when the suite
      # fails to collect and never reaches the write, but that run is already red
      # at the step above.
      - if: always()
        name: Upload a11y report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: a11y-report
          path: packages/ui/a11y-report.json

  knip:
    name: Unused exports
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - run: bun run lint:knip
        working-directory: packages/ui

  # Lockfile CVE scan. `bun audit` reads bun.lock natively, which is why this uses it
  # rather than a third-party scanner: the repo is bun-only, and resolving an unpinned
  # package from the network to check for supply-chain problems argues against itself.
  #
  # Two tiers on purpose. Critical blocks. High is advisory because the one high finding
  # today (image-size, reached through @storybook/nextjs-vite) has no fixed release —
  # the latest published version is the vulnerable one. A gate that cannot be made green
  # gets disabled within a month, so it reports instead.
  sca:
    name: Dependency audit
    needs: detect
    # `== true` coerces the string output to a number and never matches, so the
    # comparison has to be against the string `'true'`.
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: Block on critical advisories
        run: bun audit --audit-level=critical
      - name: Report high advisories
        continue-on-error: true
        run: bun audit --audit-level=high

  # security.yml runs CodeQL and Semgrep on every pull request but was not in the
  # required aggregate, so neither gated a merge — the exact anti-pattern the
  # DevSecOps guidance calls out. This job waits on that workflow's conclusion for the
  # current SHA and fails when it did not succeed, which makes it a required check
  # without duplicating the scan.
  # The gate deliberately does not filter on `detect`: security.yml scans every
  # pull request and every master push, including workflow-only diffs where no
  # package changed, and `required` treats a skipped job as passing. Gating on
  # changed packages would therefore let a workflow-only PR merge with the scan
  # ungated. The only exclusion mirrors security.yml's own: Dependabot, whose
  # restricted context startup-fails the reusable workflow.
  security-scan:
    name: Security scan gate
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for the security workflow on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          for attempt in $(seq 1 60); do
            printf "attempt %s/60\n" "$attempt"
            # Ask the security workflow for its own runs rather than filtering every
            # run for the SHA. That listing is paginated at 30 and ordered newest
            # first, and a busy pull request blows past it — review-comment traffic
            # alone can spawn dozens of runs — pushing the security run off page one,
            # where the filter finds nothing, reports "pending" forever, and times
            # out on a scan that actually succeeded.
            conclusion=$(gh api "repos/$REPO/actions/workflows/security.yml/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs | first | .conclusion // "pending"' || echo pending)
            case "$conclusion" in
              success) echo "security workflow succeeded"; exit 0 ;;
              pending|null|"") sleep 20 ;;
              *) echo "::error::security workflow concluded: $conclusion"; exit 1 ;;
            esac
          done
          echo "::error::timed out waiting for the security workflow"
          exit 1

  markdown:
    name: Markdown
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - run: bun lint:md
        working-directory: packages/ui

  spelling:
    name: Spelling
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: $/.github/actions/prepare
      - run: bun lint:spelling
        working-directory: packages/ui

  # ── Gate for branch protection ────────────────────────────────────────
  # Single status-check context consumed by the org ruleset
  # `default-branch-baseline` (id 15191038). Passes iff every real job
  # succeeded or was legitimately skipped (detect-based filtering or the
  # changeset PR-only gate). Every job below must be listed in `needs` — a job
  # missing from it is ungated, which is how the security scan went unenforced.

  required:
    name: required
    needs:
      - detect
      - lint
      - build
      - test
      - typecheck
      - examples
      - changeset
      - storybook
      - a11y
      - knip
      - sca
      - security-scan
      - markdown
      - spelling
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate upstream results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -eu
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries[] | select(.value.result != "success" and .value.result != "skipped")' >/dev/null; then
            echo "::error::One or more upstream jobs failed or were cancelled"
            exit 1
          fi
