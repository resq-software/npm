#
# OSV-Scanner configuration — scopes the commit/CI audit gate to what actually
# ships to consumers.
#
# Every advisory ignored below currently affects a DEV / BUILD / TEST-tooling
# transitive dependency only (Storybook -> next/vite/esbuild/ws/@babel/core/
# markdown-it/linkify-it, markdownlint-cli + @changesets/cli -> js-yaml/
# brace-expansion, jsdom + vitest -> undici). None is a runtime `dependencies`
# entry of any published `@resq-sw/*` package, so these advisories cannot reach
# consumers of the libraries.
#
# We ignore by SPECIFIC ADVISORY ID (not whole-package `ignore = true`): if a
# NEW advisory is published against any of these packages, it is still surfaced
# by the gate instead of being silently masked. When the dev toolchain is
# upgraded, prune any ID whose advisory no longer appears.
#
# NOTE on dompurify: it was previously ignored here, but it is production-
# reachable — `posthog-js` is an optional peer of `@resq-sw/analytics` and pulls
# dompurify into a consumer's runtime. Rather than mask it, the root package.json
# `overrides` pins dompurify to `>=3.4.11`, which clears all 8 advisories that
# affected 3.4.2. dompurify is therefore fully monitored again (no entry below).
#
# Verified 2026-07-06 via `osv-scanner scan source --lockfile=bun.lock` + a scan
# of every packages/*/package.json `dependencies` block (not devDependencies).
# The npm audit-ci pass (level=critical) already passes; this file brings the OSV
# pass in line with the same "production dependencies only" posture.

